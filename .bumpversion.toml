[tool.bumpversion]
current_version = "3.0.0b1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)((?P<stage>b|rc)(?P<num>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}{stage}{num}",
    "{major}.{minor}.{patch}"
]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []

[tool.bumpversion.parts.stage]
values = ["b", "rc"]

[tool.bumpversion.parts.num]
independent = false

# --- Files that track the full Beta version (pyproject & init) ---
[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "src/emerge/__init__.py"


# --- Files that track only the base stable version (e.g. 3.0.0 instead of 3.0.0b1) ---
