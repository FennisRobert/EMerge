[project]
name = "emerge"
version = "3.0.0b8"
description = "An open source EM FEM simulator in Python"
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "gmsh>=4.13.0, <=5.0",
    "joblib>=1.5.1",
    "loguru>=0.7.3",
    "matplotlib>=3.8.0",
    "numpy>=2.2, <2.5",
    "pyvista>=0.45.2",
    "scipy>=1.14.0",
    "mkl!=2024.0; platform_machine == \"x86_64\" or platform_machine == \"AMD64\"",
    "emsutil>=1.1.3, <1.2.0",
    "msgpack>=1.1.2",
    "msgpack-numpy>=0.4.8",
    "psutil>=7.2.2",
    "emerge-aasds>=0.4.0; sys_platform == 'darwin'"
]

[project.optional-dependencies]
umfpack = [
  "scikit-umfpack; sys_platform != 'win32'",
]
cudss = [
  "nvidia-cudss-cu12==0.5.0.16",
  "nvmath-python[cu12]==0.5.0",
  "cupy-cuda12x"
]
cudss12 = [
  "nvidia-cudss-cu12==0.5.0.16",
  "nvmath-python[cu12]==0.5.0",
  "cupy-cuda12x"
]
dxf = [
  "ezdxf"
]
cad = [
  "pygerber>=2.4, <3",
  "emcad>=0.2, <0.3",
]
spyder = [
  "trame-pyvista",
  "nest_asyncio2",
  "ipywidgets",
]

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
# The EMR Rust kernels (emr/) are compiled into the emr._emr extension module of this package.
manifest-path = "emr/Cargo.toml"
module-name = "emr._emr"
python-source = "src"
python-packages = ["emerge", "emerge_config"]
features = ["pyo3/extension-module"]
include = [{ path = "LICENSE", format = "sdist" }, { path = "THIRD_PARTY_LICENSES.md", format = "sdist" }]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "scikit-umfpack>=0.4.2",
    "twine>=7.0.0",
]

[tool.uv]
no-build-isolation-package = ["cchardet"]
cache-keys = [{ file = "pyproject.toml" }, { file = "emr/Cargo.toml" }, { file = "emr/src/**/*.rs" }]

[project.urls]
Homepage = "https://github.com/FennisRobert/EMerge"
Issues = "https://github.com/FennisRobert/EMerge/issues"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
publish-url = "https://upload.pypi.org/legacy"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple"
publish-url = "https://test.pypi.org/legacy"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--ignore=trial_scripts"
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
filterwarnings = [
  "ignore:.*SwigPyPacked.*:DeprecationWarning",
  "ignore:.*SwigPyObject.*:DeprecationWarning",
  "ignore:.*swigvarlink.*:DeprecationWarning",
]
