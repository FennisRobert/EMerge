[tool.bumpversion]
current_version = "3.0.0a9"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)((?P<stage>b|rc)(?P<num>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}{stage}{num}",
    "{major}.{minor}.{patch}"
]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []

[tool.bumpversion.parts.stage]
values = ["a","b","rc"]

[tool.bumpversion.parts.num]
independent = false

# --- 1. Files tracking the FULL version (including beta) ---
[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "src/emerge/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

# --- 2. Demo files tracking ONLY the BASE stable version ---
[[tool.bumpversion.files]]
glob = "examples/demo*.py"
search = ".check_version(\"{current_major}.{current_minor}.{current_patch}\")"
replace = ".check_version(\"{new_major}.{new_minor}.{new_patch}\")"